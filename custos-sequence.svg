<svg xmlns="http://www.w3.org/2000/svg" width="990" height="840" viewBox="0 0 990 840" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Custos gateway request, decision and call flow</title>
<desc>Sequence diagram showing the ordered calls between agent, gateway, claim registry, Treasury oracle, scoring and signing, and the downstream protocol, with deterministic error precedence and fail-closed handling.</desc>
<defs>
<marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<line x1="137" y1="78" x2="137" y2="776" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="287" y1="78" x2="287" y2="776" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="437" y1="78" x2="437" y2="776" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="587" y1="78" x2="587" y2="776" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="737" y1="78" x2="737" y2="776" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="887" y1="78" x2="887" y2="776" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>

<rect x="70" y="30" width="134" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="137" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Agent</text>
<rect x="220" y="30" width="134" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="287" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Gateway api</text>
<rect x="370" y="30" width="134" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="437" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Claim registry</text>
<rect x="520" y="30" width="134" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="587" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Treasury oracle</text>
<rect x="670" y="30" width="134" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="737" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Scoring, signing</text>
<rect x="820" y="30" width="134" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="887" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Downstream</text>

<text x="30" y="112" dominant-baseline="central" font-size="12" font-weight="500" fill="#888780">1</text>
<text x="212" y="102" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">post /v1/intent</text>
<line x1="137" y1="116" x2="283" y2="116" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ad)"/>
<rect x="228" y="130" width="290" height="46" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="373" y="147" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#633806">Validate schema, expiry and clock skew</text>
<text x="373" y="164" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">gateway.validation</text>
<text x="212" y="192" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">e100 / e102 / e103</text>
<line x1="283" y1="206" x2="141" y2="206" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#ar)"/>

<text x="30" y="244" dominant-baseline="central" font-size="12" font-weight="500" fill="#888780">2</text>
<text x="362" y="234" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">get_claim(asset_id)</text>
<line x1="287" y1="248" x2="433" y2="248" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ad)"/>
<text x="362" y="272" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">claim or none</text>
<line x1="433" y1="286" x2="291" y2="286" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ad)"/>
<text x="212" y="310" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">none maps to e200</text>
<line x1="283" y1="324" x2="141" y2="324" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#ar)"/>

<text x="30" y="362" dominant-baseline="central" font-size="12" font-weight="500" fill="#888780">3</text>
<text x="437" y="352" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">get_observation(claim.tenor)</text>
<line x1="287" y1="366" x2="583" y2="366" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ad)"/>
<rect x="528" y="380" width="290" height="46" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="673" y="397" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#633806">Ttl cache, else fetch official feed</text>
<text x="673" y="414" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">percent normalised to integer bps</text>
<text x="437" y="442" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">observation or none</text>
<line x1="583" y1="456" x2="291" y2="456" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ad)"/>

<text x="30" y="494" dominant-baseline="central" font-size="12" font-weight="500" fill="#888780">4</text>
<text x="512" y="484" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">evaluate(intent, claim, observation)</text>
<line x1="287" y1="498" x2="733" y2="498" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ad)"/>
<rect x="628" y="512" width="300" height="60" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="778" y="529" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#633806">Decision order</text>
<text x="778" y="546" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">e300, e301 then e101 then e201 then e202</text>
<text x="778" y="562" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">all pass produces scores</text>
<text x="512" y="590" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">block verdict with scores</text>
<line x1="733" y1="604" x2="291" y2="604" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="212" y="628" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">http 403 or 503</text>
<line x1="283" y1="642" x2="141" y2="642" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#ar)"/>

<text x="30" y="666" dominant-baseline="central" font-size="12" font-weight="500" fill="#888780">5</text>
<text x="512" y="666" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">allow, canonicalise and ed25519 sign</text>
<line x1="733" y1="680" x2="291" y2="680" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="212" y="700" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">200 signed attestation</text>
<line x1="283" y1="714" x2="141" y2="714" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="587" y="736" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">post with x-custos-attestation header</text>
<line x1="291" y1="750" x2="883" y2="750" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="587" y="770" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">response, connection failure maps to e400</text>
<line x1="883" y1="784" x2="291" y2="784" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ad)"/>

<rect x="70" y="802" width="884" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="512" y="815" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#04342C">Security property: downstream is never called until validation, claim resolution, live observation, scoring and signing have all succeeded</text>
</svg>
