<svg xmlns="http://www.w3.org/2000/svg" width="680" height="580" viewBox="0 0 680 580" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Custos gateway runtime architecture</title>
<desc>An agent posts an intent to the Custos gateway, which validates the envelope, resolves the on-chain claim, fetches a live Treasury yield observation, scores it, then either blocks with a structured error or signs an attestation and forwards downstream.</desc>
<defs>
<marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="180" y="30" width="160" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="260" y="48" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Agent</text>
<text x="260" y="66" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">post /v1/intent</text>

<rect x="40" y="95" width="460" height="315" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="64" y="120" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Custos gateway</text>

<rect x="70" y="135" width="400" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="270" y="152" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">1. Validate envelope</text>
<text x="270" y="170" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">schema, expiry, clock skew</text>

<rect x="70" y="199" width="400" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="270" y="216" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">2. Resolve claim</text>
<text x="270" y="234" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">asset id to claim record</text>

<rect x="70" y="263" width="400" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="270" y="280" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">3. Fetch observation</text>
<text x="270" y="298" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">live yield, ttl cached</text>

<rect x="70" y="327" width="200" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="170" y="344" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">4. Score and decide</text>
<text x="170" y="362" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">staleness, drift, backing</text>

<rect x="290" y="327" width="180" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="380" y="344" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">5. Sign attestation</text>
<text x="380" y="362" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">allow verdicts only</text>

<rect x="520" y="258" width="120" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="580" y="278" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Treasury feed</text>
<text x="580" y="296" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">daily yield curve</text>

<rect x="70" y="470" width="200" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="170" y="490" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#501313">Block</text>
<text x="170" y="508" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">custos-exxx to agent</text>

<rect x="280" y="470" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="380" y="490" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">Allow</text>
<text x="380" y="508" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">signed attestation</text>

<rect x="520" y="470" width="120" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="580" y="490" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Downstream</text>
<text x="580" y="508" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">lender or dex</text>

<line x1="260" y1="82" x2="260" y2="131" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ad)"/>
<line x1="270" y1="181" x2="270" y2="195" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ad)"/>
<line x1="270" y1="245" x2="270" y2="259" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ad)"/>
<line x1="170" y1="309" x2="170" y2="323" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ad)"/>
<line x1="474" y1="278" x2="516" y2="278" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ad)"/>
<line x1="516" y1="296" x2="474" y2="296" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ad)"/>
<line x1="274" y1="350" x2="286" y2="350" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ad)"/>
<line x1="170" y1="377" x2="170" y2="464" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="380" y1="377" x2="380" y2="464" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ag)"/>
<line x1="484" y1="498" x2="516" y2="498" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ag)"/>

<circle cx="150" cy="556" r="4" fill="#0F6E56"/>
<text x="164" y="556" dominant-baseline="central" font-size="12" fill="#5F5E5A">Allow path, signed</text>
<circle cx="330" cy="556" r="4" fill="#A32D2D"/>
<text x="344" y="556" dominant-baseline="central" font-size="12" fill="#5F5E5A">Block path, fail closed</text>
</svg>
